name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Keep the Slint/wgpu build within the hosted runner's disk budget.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  slint:
    name: Slint syntax and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Slint formatter runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libinput10
      - name: Install the Slint formatter matching Cargo.lock
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "i-slint-compiler"))')"
          mkdir -p "$RUNNER_TEMP/slint-tools"
          curl --fail --location --retry 3 \
            "https://github.com/slint-ui/slint/releases/download/v${version}/slint-lsp-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/slint-tools/slint-lsp.tar.gz"
          tar -xzf "$RUNNER_TEMP/slint-tools/slint-lsp.tar.gz" -C "$RUNNER_TEMP/slint-tools" --strip-components=1
          echo "$RUNNER_TEMP/slint-tools" >> "$GITHUB_PATH"
      - name: Check every tracked Slint file
        shell: bash
        run: |
          git ls-files -z -- '*.slint' | xargs -0 --no-run-if-empty slint-lsp format -i
          git diff --exit-code -- '*.slint'

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        run: |
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$archive"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" \
            --output checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint -color

  windows:
    name: Windows check, Clippy, build and tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Neocari is a Git submodule and a required path dependency.
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust and compile Slint UI
        # pet-ui/build.rs checks Slint imports, types, bindings and resources.
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build both application binaries
        run: cargo build --workspace --bins --locked
      - name: Unit and integration tests
        # GPU/model-dependent tests remain opt-in through their #[ignore] attributes.
        run: cargo test --workspace --all-targets --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  linux:
    name: Linux X11 check, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install X11, GTK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libegl1-mesa-dev \
            libfontconfig1-dev xvfb xauth dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust and compile Slint UI
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build both application binaries
        run: cargo build --workspace --bins --locked
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
      - name: X11 pointer, monitor and click-through test
        run: xvfb-run -a cargo test -p pet-window --test x11 --locked -- --ignored --test-threads=1
      - name: Two-process startup and shutdown under X11
        shell: bash
        run: |
          root="$(mktemp -d)"
          export BANDORI_PET_ROOT="$root"
          export BANDORI_PET_HEADLESS=1
          export BANDORI_PET_EXIT_AFTER_SECS=5
          export SLINT_BACKEND=winit-software
          export RUST_LOG=info
          dbus-run-session -- xvfb-run -a timeout 30s target/debug/bandori-pet
          grep -rF -- 'settings process connected' "$root/logs"
          grep -rF -- 'bandori-ui exited' "$root/logs"
      - name: Package Linux binaries
        run: bash scripts/package-linux.sh --debug --skip-build
      - name: Upload Linux application
        uses: actions/upload-artifact@v6
        with:
          name: BANDORI-PET-LITE-x86_64-unknown-linux-gnu-debug
          path: dist/linux-x86_64-unknown-linux-gnu-debug/BANDORI-PET-LITE.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.target }}) check, build and tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check Rust and compile Slint UI
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
      - name: Build and package the app bundle
        run: bash scripts/package-macos.sh --target=${{ matrix.target }}
      - name: Upload macOS application
        uses: actions/upload-artifact@v6
        with:
          name: BANDORI-PET-LITE-${{ matrix.target }}
          path: dist/macos-${{ matrix.target }}-release/BANDORI-PET-LITE.zip
          if-no-files-found: error
