[package]
name = "neocari"
version = "0.4.0"
edition = "2024"
description = "A pure Rust Live2D/Cubism runtime with native Cubism V2 model support"
license = "GPL-3.0-only"
repository = "https://github.com/HELPMEEADICE/Neocari"
readme = "README.md"
keywords = ["live2d", "cubism", "runtime", "renderer", "wgpu"]
categories = ["rendering", "game-development", "graphics"]

# Vendored from https://github.com/HELPMEEADICE/Neocari at revision ba9de37
# (the revision BANDORI-PET-LITE is validated against). Only the library target
# is kept: upstream examples and the GPU integration test are left out so the
# vendored crate needs no ab_glyph / winit dev-dependencies.
#
# Local additions are marked with `// bandori-pet-lite:` comments; see
# vendor/neocari/PATCHES.md.

[features]
default = []
wgpu = ["dep:wgpu"]

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
png = { version = "0.18.1", features = ["zlib-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
wgpu = { version = "30.0.0", features = ["noop"], optional = true }
