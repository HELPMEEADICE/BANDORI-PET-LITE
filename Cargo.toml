[workspace]
resolver = "2"
# `vendor/neocari` is a path dependency, not a member: its own unit tests need the
# upstream sample models (`assets/models/Hiyori`), which the upstream crate excludes
# from published sources. Keeping it out of the member list keeps
# `cargo test --workspace` green while still building it as a dependency.
exclude = ["vendor/neocari"]
members = [
    "crates/pet-config",
    "crates/pet-assets",
    "crates/pet-live2d",
    "crates/pet-render",
    "crates/pet-input",
    "crates/pet-behavior",
    "crates/pet-window",
    "crates/pet-ipc",
    "crates/pet-ui",
    "crates/pet-util",
    "crates/pet-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["BANDORI-PET-LITE contributors"]
repository = "https://github.com/HELPMEEADICE/Neocari"

[workspace.dependencies]
pet-config = { path = "crates/pet-config" }
pet-assets = { path = "crates/pet-assets" }
pet-live2d = { path = "crates/pet-live2d" }
pet-render = { path = "crates/pet-render" }
pet-input = { path = "crates/pet-input" }
pet-behavior = { path = "crates/pet-behavior" }
pet-window = { path = "crates/pet-window" }
pet-ipc = { path = "crates/pet-ipc" }
pet-ui = { path = "crates/pet-ui" }
pet-util = { path = "crates/pet-util" }

# Live2D runtime: Cubism 2 `.moc` + Cubism 3/4/5 `.moc3`, pure Rust, GPL-3.0-only.
# `upstream/Neocari` is https://github.com/HELPMEEADICE/Neocari @ ba9de37, vendored
# so the workspace builds offline and so local additions stay reviewable
# (see vendor/neocari/PATCHES.md).
neocari = { path = "vendor/neocari", features = ["wgpu"], default-features = false }

wgpu = "30"
winit = "0.30.13"
slint = "1.18"
slint-build = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.26"
muda = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zstd = "0.14"
tar = "0.4"
pollster = "1"
interprocess = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2


